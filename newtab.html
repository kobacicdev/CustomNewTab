<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">

    <!-- 検索ボックスエリア -->
    <section class="search-area">
      <div class="search-box">
        <form id="google-search-form">
          <img src="https://www.google.com/favicon.ico" alt="Google" class="search-icon">
          <input type="text" id="google-search" placeholder="Google で検索...">
        </form>
      </div>
      <div class="search-box">
        <form id="perplexity-search-form">
          <img src="https://www.google.com/s2/favicons?sz=64&domain=perplexity.ai" alt="Perplexity" class="search-icon">
          <input type="text" id="perplexity-search" placeholder="Perplexity で検索...">
        </form>
      </div>
    </section>

    <!-- メインコンテンツ -->
    <div class="main-content">

      <!-- 左カラム -->
      <div class="left-column">
        <!-- カスタムカレンダー（v1.2: h2見出し削除） -->
        <section class="card calendar-embed">
          <div id="calendar-container"></div>
        </section>

        <!-- 予定リスト（v1.2: h2→動的div見出し） -->
        <section class="card events-list">
          <div class="events-heading" id="events-heading">📋 今月の予定</div>
          <div id="events-container">
            <p class="loading">読み込み中...</p>
          </div>
        </section>
      </div>

      <!-- 中央カラム -->
      <div class="center-column">
        <section class="card favorites">
          <div id="favorites-container"></div>
        </section>
      </div>

      <!-- 右カラム -->
      <div class="right-column">
        <section class="card news">
          <div id="news-container">
            <p class="loading">読み込み中...</p>
          </div>
        </section>
      </div>

    </div>
  </div>

  <!-- 設定ボタン（右下に薄く表示） -->
  <button class="settings-btn" id="settings-btn" title="設定">⚙</button>

  <script src="js/calendar.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/search.js"></script>
  <script src="js/news.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
