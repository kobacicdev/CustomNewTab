<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="container">
    <section class="search-area" id="search-area"></section>
    <div class="main-content">
      <div class="left-column">
        <section class="card calendar-embed">
          <div id="calendar-container"></div>
        </section>
        <section class="card events-list">
          <div id="events-container">
            <p class="loading">読み込み中...</p>
          </div>
        </section>
      </div>
      <div class="center-column">
        <section class="card favorites">
          <div id="favorites-container"></div>
        </section>
      </div>
      <div class="right-column">
        <section class="card news">
          <div id="news-container">
            <p class="loading">読み込み中...</p>
          </div>
        </section>
      </div>
    </div>
  </div>
  <button class="settings-btn" id="settings-btn" title="設定">⚙</button>
  <script src="js/calendar.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/search.js"></script>
  <script src="js/news.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
